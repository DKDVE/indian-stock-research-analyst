# Blueprint for Render — deploy with Dashboard → New → Blueprint and select this repo, OR paste
# `startCommand` below into Web Service → Settings → Start Command. A plain “Web Service” from Git
# does not read this file unless it was created from a Blueprint. Prefer gunicorn.conf.py so timeout
# is versioned; GUNICORN_CMD_ARGS in .env.example is a fallback if you cannot change Start Command.
services:
  - type: web
    name: indian-stock-research-analyst
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # See gunicorn.conf.py — timeout/thread settings must not be only in env (easy to miss on Render).
    startCommand: gunicorn -c gunicorn.conf.py app:app
